services:
  mock-apis:
    build:
      context: .
      args:
        APP: mock-apis
    ports:
      - "4001:4001"

  bff-service:
    build:
      context: .
      args:
        APP: bff-service
    ports:
      - "4000:4000"
    environment:
      - MOCK_API_BASE_URL=http://mock-apis:4001
    depends_on:
      - mock-apis

  web-frontend:
    build:
      context: .
      args:
        APP: web-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_BFF_URL=http://bff-service:4000
    depends_on:
      - bff-service
